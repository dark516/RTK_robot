ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: true
    sensor_timeout: 0.2
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # Nav2 asks TF at "now" while wheel odometry arrives at 10 Hz. A small
    # forward offset prevents harmless 1-2 ms future-extrapolation failures.
    transform_time_offset: 0.05

    odom0: /odom
    # Fuse the bounded wheel pose as well as forward/yaw velocity. Velocity-only
    # fusion leaves global x/y unobservable and made covariance grow without
    # bound during a stationary period.
    odom0_config: [true, true, false,  # X, Y, Z
               false, false, true,  # Roll, Pitch, Yaw
               true, false, false,  # Vx, Vy, Vz
               false, false, true,  # Vroll, Vpitch, Vyaw
               false, false, false] # Ax, Ay, Az
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # MPU6050 has no absolute yaw reference. The current driver also publishes
    # an invalid zero quaternion and zero covariances, so it must not be fused
    # until the gyro bias and covariance are calibrated.

    odom0_pose_rejection_threshold: 10.0
    odom0_twist_rejection_threshold: 5.0

    odom0_pose_noise:
      x: 0.05
      y: 0.05
      z: 0.05
      roll: 0.05
      pitch: 0.05
      yaw: 0.05

    odom0_twist_noise:
      x: 0.05
      y: 0.05
      z: 0.05
      roll: 0.05
      pitch: 0.05
      yaw: 0.05

    velocity_limits:
      linear:
        x: 0.486
        y: 0.0
        z: 0.0
      angular:
        x: 0.0
        y: 0.0
        z: 5.4

    acceleration_limits:
      linear:
        x: 0.5
        y: 0.0
        z: 0.0
      angular:
        x: 0.0
        y: 0.0
        z: 5.4
