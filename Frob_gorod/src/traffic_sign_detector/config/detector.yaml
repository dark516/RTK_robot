traffic_sign_detector:
  ros__parameters:
    # Existing main.py settings
    model_path: "models/best.pt"
    camera_index: 0
    frame_width: 1280
    frame_height: 720

    default_confidence: 0.80
    bus_stop_confidence: 0.40
    parking_confidence: 0.60

    # Calibrated on the robot's JSK Integrated Camera at 1280x720:
    # a 100 mm LEFT sign at 0.53 m spans about 283 px.
    focal_length_px: 1500.0
    parking_distance_scale: 1.54
    filter_size: 5

    signs.straight.dimension_m: 0.100
    signs.straight.axis: "height"
    signs.left.dimension_m: 0.100
    signs.left.axis: "height"
    signs.right.dimension_m: 0.100
    signs.right.axis: "height"
    signs.no_left.dimension_m: 0.100
    signs.no_left.axis: "height"
    signs.no_right.dimension_m: 0.100
    signs.no_right.axis: "height"
    signs.bus_stop.dimension_m: 0.130
    signs.bus_stop.axis: "height"
    signs.parking.dimension_m: 0.090
    signs.parking.axis: "mean"
    signs.obstacle.dimension_m: 0.130
    signs.obstacle.axis: "width"

    # Input: "camera" opens camera_index; "topic" reads raw images;
    # "compressed_topic" reads JPEG frames (recommended for laptop inference).
    input_source: "camera"
    camera_fps: 30.0
    camera_frame_id: "camera"
    image_topic: "/camera/image_raw"
    compressed_image_topic: "/camera/image_raw/compressed"

    detections_topic: "/traffic_sign/detections"
    annotated_image_topic: "/traffic_sign/annotated_image"
    publish_annotated_image: true
    annotated_compressed_topic: "/traffic_sign/annotated_image/compressed"
    publish_annotated_compressed: false
    annotated_jpeg_quality: 70

    display_window: false
    draw_debug_info: true
    window_name: "YOLO Traffic Sign Detection"

    # Empty yolo_device lets Ultralytics choose. Examples: "cpu", "0".
    yolo_device: ""
    # Zero keeps the Ultralytics default inference size.
    yolo_image_size: 0
